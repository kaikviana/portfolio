<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <!-- Sombra do Notebook -->
  <rect x="40" y="470" width="620" height="20" fill="#000000" opacity="0.3" filter="blur(10px)" />
  
  <!-- MOLDURA DO NOTEBOOK -->
  <!-- Carcaça da Tela -->
  <rect x="50" y="80" width="600" height="380" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <!-- Tela Interna (Onde vai a imagem desktop) -->
  <rect x="65" y="95" width="570" height="350" rx="4" fill="#020510" />
  <image href="/catalogo.png" x="65" y="95" width="570" height="350" preserveAspectRatio="xMidYMid slice" />
  
  <!-- Base do Notebook (Teclado/Apoio) -->
  <path d="M30 460 L670 460 L680 475 L20 475 Z" fill="#0F172A" />
  <!-- Detalhe do Touchpad (Abertura) -->
  <path d="M300 460 L400 460 L405 463 L295 463 Z" fill="#334155" />

  <!-- Sombra do Celular -->
  <rect x="530" y="210" width="200" height="370" rx="30" fill="#000000" opacity="0.4" filter="blur(12px)" />

  <!-- MOLDURA DO CELULAR (Sobreposta à direita) -->
  <!-- Carcaça do Celular -->
  <rect x="540" y="190" width="180" height="370" rx="28" fill="#0F172A" stroke="#475569" stroke-width="6"/>
  <!-- Tela Interna (Onde vai a imagem mobile) -->
  <rect x="545" y="195" width="170" height="360" rx="24" fill="#020510" />
  <image href="/catalogo-mobile.jpg" x="545" y="195" width="170" height="360" preserveAspectRatio="xMidYMid slice" />
  
  <!-- Notch do Celular (Detalhe da câmera) -->
  <rect x="595" y="195" width="70" height="15" rx="6" fill="#0F172A" />
</svg>
