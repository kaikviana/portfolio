<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Gradientes e Filtros de Brilho idênticos ao Tailwind do Portfólio -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Escuro Perfeito (#020617) -->
  <rect width="100%" height="100%" fill="#020617"/>
  
  <!-- Aura Azul Flutuante (Efeito de Energia atrás do celular) -->
  <rect x="260" y="40" width="280" height="520" rx="40" fill="#2563eb" opacity="0.15" filter="url(#glow)"/>

  <!-- Chassi do Celular (Borda Azulada) -->
  <rect x="260" y="40" width="280" height="520" rx="36" fill="#0f172a" stroke="#1e3a8a" stroke-width="4"/>
  
  <!-- Tela Interna do Celular -->
  <rect x="264" y="44" width="272" height="512" rx="32" fill="#020617" />

  <!-- Câmera Frontal (Notch) -->
  <rect x="360" y="50" width="80" height="18" rx="9" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Foto de Perfil (Avatar Estilo Terminal) -->
  <circle cx="400" cy="140" r="36" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="148" fill="#3b82f6" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  
  <!-- Identidade Visual (Textos) -->
  <text x="400" y="210" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">Kaik Sousa.</text>
  <text x="400" y="230" fill="#3b82f6" font-family="monospace" font-size="12" text-anchor="middle">/hub-de-links_</text>

  <!-- Botões de Links -->
  <!-- Botão 1: Destaque Principal -->
  <rect x="290" y="270" width="220" height="48" rx="12" fill="url(#blue-grad)"/>
  <text x="400" y="299" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Meu Setup de Desenvolvimento</text>

  <!-- Botão 2: Estilo Glassmorphism (KS SOFT) -->
  <rect x="290" y="335" width="220" height="48" rx="12" fill="#0f172a" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="400" y="364" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">KS SOFT (Sistema PDV)</text>

  <!-- Botão 3: Equipamentos -->
  <rect x="290" y="400" width="220" height="48" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="400" y="429" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Equipamentos &amp; Produtividade</text>
  
  <!-- Botão 4: Repositórios -->
  <rect x="290" y="465" width="220" height="48" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="400" y="494" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Repositórios e Código</text>
</svg>
